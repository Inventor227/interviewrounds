[package]
name = "ir-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "ir_server"
path = "src/lib.rs"

[[bin]]
name = "ir-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
eventsource-stream = "0.2.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
reqwest = { version = "0.13.5", features = ["json", "stream", "http2"] }
thiserror = "2"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "set-header",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
